version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: plantdoctor
      POSTGRES_USER: plantdoctor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plantdoctor123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdoctor"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/xuanhoatrieu/plantdoctor-backend:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plantdoctor:${DB_PASSWORD:-plantdoctor123}@postgres:5432/plantdoctor
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    ports:
      - "8001:8001"

  frontend:
    image: ghcr.io/xuanhoatrieu/plantdoctor-frontend:latest
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
