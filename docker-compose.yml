services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: plantdoctor
      POSTGRES_USER: plantdoctor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plantdoctor123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantdoctor"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://plantdoctor:${DB_PASSWORD:-plantdoctor123}@postgres:5432/plantdoctor
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
