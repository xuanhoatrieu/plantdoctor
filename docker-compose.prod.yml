services:
  plant-api:
    image: ghcr.io/xuanhoatrieu/plantdoctor-backend:latest
    container_name: benhcay-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Required. Compose refuses to start instead of silently passing an empty signing key.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the server .env file}
      # Optional: only if SECRET_KEY was rotated, put the OLD value here so legacy password hashes still verify.
      LEGACY_SECRET_KEY: ${LEGACY_SECRET_KEY:-}
      # Optional fallbacks when the LLM connection is not configured in Admin > Settings.
      LLM_API_URL: ${LLM_API_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Optional: extra trusted browser origins (comma-separated) and /predict rate limits.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PREDICT_RATE_LIMIT_USER: ${PREDICT_RATE_LIMIT_USER:-40}
      PREDICT_RATE_LIMIT_GUEST: ${PREDICT_RATE_LIMIT_GUEST:-60}
    networks:
      - tuaf-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  plant-web:
    image: ghcr.io/xuanhoatrieu/plantdoctor-frontend:latest
    container_name: benhcay-web
    restart: unless-stopped
    depends_on:
      plant-api:
        condition: service_healthy
    networks:
      - tuaf-ai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tuaf-ai-network:
    external: true
    name: tuaf-ai-network
