services:
  plant-api:
    image: ghcr.io/xuanhoatrieu/plantdoctor-backend:latest
    container_name: benhcay-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - tuaf-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  plant-web:
    image: ghcr.io/xuanhoatrieu/plantdoctor-frontend:latest
    container_name: benhcay-web
    restart: unless-stopped
    depends_on:
      plant-api:
        condition: service_healthy
    networks:
      - tuaf-ai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  tuaf-ai-network:
    external: true
    name: tuaf-ai-network
